<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>适老化数字人中国象棋棋友</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>🀄 适老化数字人中国象棋棋友</h1>
      <div class="topbar-actions">
        <label for="personality">棋友人格</label>
        <select id="personality">
          <option value="laozhang">老张（豪爽棋友）</option>
          <option value="xiaoya">小雅（温柔陪练）</option>
        </select>
        <button id="btn-new-game">新开对局</button>
      </div>
    </header>

    <main class="layout">
      <section class="board-wrap">
        <div id="board" class="board">
          <div id="ai-thinking" class="thinking-pill hidden">🤔 AI 思考中<span class="pill-dots"></span></div>
        </div>
        <div class="board-side">
          <div class="status" id="status">正在准备开局…</div>
          <div class="winbar">
            <span class="side-label red">红方(你)</span>
            <div class="bar"><div id="win-fill"></div></div>
            <span class="side-label black">黑方(AI)</span>
          </div>
        </div>
      </section>

      <aside class="companion">
        <div class="avatar-card">
          <div class="avatar" id="avatar">🧓</div>
          <div class="avatar-name" id="avatar-name">老张</div>
          <div class="avatar-meta">
            <span class="chip" id="emotion-chip">情绪 --</span>
            <span class="chip" id="action-chip">动作 --</span>
          </div>
        </div>
        <div class="speech" id="speech">你好呀老哥，咱开局杀一盘！</div>

        <div class="panel-section">
          <h3>本局事件</h3>
          <ul id="events"><li class="muted">暂无</li></ul>
        </div>
        <div class="panel-section">
          <h3>棋友画像（下棋行为统计，非医疗诊断）</h3>
          <div id="profile" class="muted">开局后逐步生成…</div>
        </div>
        <div class="panel-section">
          <h3>长期记忆</h3>
          <ul id="memories"><li class="muted">暂无</li></ul>
        </div>
      </aside>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/chessboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
